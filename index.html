<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slayer · DRPG Battle Prototype</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">SLAYER / SVG DRPG ENCOUNTER</p>
        <h1>第一人称回合战斗</h1>
      </div>
      <button id="restart-button" class="secondary-button" type="button">重置战斗</button>
    </header>

    <section class="encounter-shell" aria-label="DRPG 战斗视图">
      <section class="viewport-panel">
        <div class="viewport-meta">
          <div>
            <p class="section-label">ENCOUNTER</p>
            <h2 id="battle-status">等待战斗开始</h2>
          </div>
          <div id="battle-meta" class="battle-meta" aria-live="polite"></div>
        </div>
        <div class="viewport-frame">
          <div class="depth-grid" aria-hidden="true"></div>
          <div id="enemy-formation" class="enemy-formation" aria-label="敌方阵列"></div>
        </div>
      </section>

      <section class="party-panel" aria-label="队伍状态">
        <div class="panel-heading">
          <div>
            <p class="section-label">PARTY STATUS</p>
            <h2>三人队伍</h2>
          </div>
          <div id="acting-unit" class="acting-unit">-</div>
        </div>
        <div id="party-roster" class="party-roster"></div>
      </section>
    </section>

    <section class="control-grid">
      <section class="command-panel" aria-label="行动指令">
        <div class="panel-heading">
          <div>
            <p class="section-label">COMMAND</p>
            <h2 id="command-title">等待战斗开始</h2>
          </div>
        </div>
        <div id="skill-list" class="skill-list"></div>
        <div id="target-list" class="target-list" aria-live="polite"></div>
      </section>

      <section class="log-panel" aria-label="战斗日志">
        <div class="panel-heading">
          <div>
            <p class="section-label">BATTLE LOG</p>
            <h2>结构化事件流</h2>
          </div>
        </div>
        <ol id="battle-log" class="battle-log"></ol>
      </section>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
